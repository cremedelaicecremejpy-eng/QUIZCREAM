<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Question</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .card.quiz-layout {
      max-width: 720px;
      padding: 1.75rem;
    }

    .card h1 {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #667eea;
      margin-bottom: 0.75rem;
    }

    .progress {
      font-size: 0.8125rem;
      color: #6b7280;
      margin-bottom: 0.5rem;
    }

    .timer-row .progress {
      margin-bottom: 0;
      text-align: left;
      flex: 1;
    }

    .timer-track {
      height: 12px;
      background: #ececf4;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.35rem;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 7s linear;
    }

    .timer-fill.urgent {
      background: linear-gradient(90deg, #dc2626, #f97316);
    }

    .timer-fill.paused {
      transition: none;
    }

    .timer-top {
      margin-bottom: 0.75rem;
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
    }

    .timer-label {
      font-size: 0.9375rem;
      font-weight: 700;
      color: #667eea;
      white-space: nowrap;
    }

    .timer-label.urgent {
      color: #dc2626;
    }

    .potential-points {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #16a34a;
      margin-bottom: 0.5rem;
    }

    .potential-points.urgent {
      color: #dc2626;
    }

    .quiz-body {
      display: flex;
      gap: 1.25rem;
      align-items: stretch;
    }

    .quiz-main {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .score-sidebar {
      width: 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 0.25rem;
    }

    .score-sidebar-title {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      margin-bottom: 0.5rem;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }

    .score-track-vertical {
      flex: 1;
      min-height: 220px;
      width: 14px;
      background: #ececf4;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .score-fill-vertical {
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #16a34a, #667eea);
      border-radius: 999px;
      transition: height 0.45s ease-out;
    }

    .score-fill-opponent {
      background: linear-gradient(180deg, #f97316, #764ba2);
    }

    .score-sidebar-opponent .live-score {
      color: #764ba2;
    }

    .score-sidebar.hidden {
      display: none;
    }

    .score-fill-vertical.bump {
      filter: brightness(1.15);
    }

    .live-score {
      font-size: 0.875rem;
      font-weight: 800;
      color: #667eea;
      margin-top: 0.5rem;
      line-height: 1.2;
    }

    .max-score-hint {
      font-size: 0.6875rem;
      color: #9ca3af;
      margin-top: 0.15rem;
    }

    .card .question {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.4;
      margin-bottom: 2rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .options button {
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      font-weight: 500;
      color: #1a1a2e;
      background: #f4f4f8;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .options button:hover:not(:disabled) {
      background: #ececf4;
      border-color: #667eea;
      transform: translateY(-1px);
    }

    .options button:active:not(:disabled) {
      transform: translateY(0);
    }

    .options button:disabled {
      cursor: default;
      opacity: 0.6;
      transform: none;
    }

    .options button.selected-correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #16a34a;
      opacity: 1;
    }

    .options button.selected-wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #dc2626;
      opacity: 1;
    }

    .feedback {
      margin-top: 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      min-height: 1.75rem;
    }

    .feedback.correct {
      color: #16a34a;
    }

    .feedback.wrong {
      color: #dc2626;
    }

    .next-btn {
      margin-top: 1.25rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #ffffff;
      background: #667eea;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .next-btn:hover {
      background: #5a6fd6;
      transform: translateY(-1px);
    }

    .next-btn:active {
      transform: translateY(0);
    }

    .next-btn.hidden {
      display: none;
    }

    .score-screen .score-value {
      font-size: 3rem;
      font-weight: 800;
      color: #667eea;
      margin: 1rem 0 0.5rem;
    }

    .score-screen .score-label {
      font-size: 1.125rem;
      color: #6b7280;
      margin-bottom: 2rem;
    }

    .score-screen .score-message {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 1.5rem;
    }

    .restart-btn {
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #ffffff;
      background: #667eea;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .restart-btn:hover {
      background: #5a6fd6;
      transform: translateY(-1px);
    }

    .topic-screen.hidden,
    .quiz-screen.hidden,
    .score-screen.hidden {
      display: none;
    }

    .topic-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .topic-btn {
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a2e;
      background: #f4f4f8;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .topic-btn:hover:not(:disabled) {
      background: #ececf4;
      border-color: #667eea;
      transform: translateY(-1px);
    }

    .topic-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .error-msg {
      color: #dc2626;
      margin-top: 1rem;
      font-weight: 600;
    }

    .nickname-field {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 2px solid #ececf4;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      outline: none;
    }

    .nickname-field:focus {
      border-color: #667eea;
    }

    .topic-row {
      background: #f4f4f8;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      text-align: left;
    }

    .topic-name {
      font-size: 1rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.75rem;
    }

    .topic-actions {
      display: flex;
      gap: 0.5rem;
    }

    .topic-actions .topic-btn {
      flex: 1;
      padding: 0.625rem 0.75rem;
      font-size: 0.875rem;
    }

    .topic-btn.battle {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #ffffff;
    }

    .topic-btn.battle:hover:not(:disabled) {
      background: linear-gradient(135deg, #5a6fd6, #6a4190);
      border-color: transparent;
    }

    .waiting-screen.hidden,
    .match-score-screen.hidden {
      display: none;
    }

    .waiting-spinner {
      font-size: 2.5rem;
      margin: 1.5rem 0;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1); }
    }

    .waiting-topic {
      font-size: 1.125rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.5rem;
    }

    .waiting-hint {
      color: #6b7280;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .cancel-btn {
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #667eea;
      background: #ffffff;
      border: 2px solid #667eea;
      border-radius: 10px;
      cursor: pointer;
    }

    .match-meta {
      font-size: 0.8125rem;
      color: #6b7280;
      margin-bottom: 0.35rem;
    }

    .match-result {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 1rem 0;
    }

    .match-result.win { color: #16a34a; }
    .match-result.lose { color: #dc2626; }
    .match-result.draw { color: #667eea; }

    .match-scores {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    .match-scores div {
      text-align: center;
    }

    .match-scores .label {
      font-size: 0.75rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .match-scores .value {
      font-size: 2rem;
      font-weight: 800;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div id="card" class="card">
    <div id="topic-screen" class="topic-screen">
      <h1>Quiz Cream</h1>
      <p class="subtitle">Solo practice or 1v1 battle — 7 questions, 7 seconds each.</p>
      <input id="nickname" class="nickname-field" type="text" maxlength="20" placeholder="Your nickname" />
      <div id="topic-list" class="topic-list"></div>
      <p id="topic-error" class="error-msg"></p>
    </div>

    <div id="waiting-screen" class="waiting-screen hidden">
      <h1>Finding Match</h1>
      <div class="waiting-spinner">⚔️</div>
      <p id="waiting-topic" class="waiting-topic"></p>
      <p class="waiting-hint">Open another browser tab (or ask a friend) and queue the same topic.</p>
      <button class="cancel-btn" onclick="cancelMatchmaking()">Cancel</button>
    </div>

    <div id="quiz-screen" class="quiz-screen hidden">
      <div class="timer-top">
        <div class="timer-row">
          <span class="progress" id="progress"></span>
          <span id="timer-label" class="timer-label">7.0s</span>
        </div>
        <div class="timer-track">
          <div id="timer-fill" class="timer-fill"></div>
        </div>
        <p id="potential-points" class="potential-points">+1000 pts if correct now</p>
      </div>

      <p id="match-meta" class="match-meta hidden"></p>

      <div class="quiz-body">
        <aside class="score-sidebar score-sidebar-you">
          <span id="player-sidebar-title" class="score-sidebar-title">You</span>
          <div class="score-track-vertical">
            <div id="score-fill" class="score-fill-vertical"></div>
          </div>
          <p id="live-score" class="live-score">0</p>
          <p id="max-score-hint" class="max-score-hint">/ 7000</p>
        </aside>

        <div class="quiz-main">
          <h1>Trivia</h1>
          <p id="question" class="question"></p>
          <div id="options" class="options"></div>
          <p id="feedback" class="feedback"></p>
          <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Next Question</button>
        </div>

        <aside id="opponent-sidebar" class="score-sidebar score-sidebar-opponent hidden">
          <span id="opponent-sidebar-title" class="score-sidebar-title">Opponent</span>
          <div class="score-track-vertical">
            <div id="opponent-score-fill" class="score-fill-vertical score-fill-opponent"></div>
          </div>
          <p id="opponent-live-score" class="live-score">0</p>
          <p id="opponent-max-score-hint" class="max-score-hint">/ 7000</p>
        </aside>
      </div>
    </div>

    <div id="match-score-screen" class="match-score-screen hidden">
      <h1>Battle Over</h1>
      <p id="match-result" class="match-result"></p>
      <div class="match-scores">
        <div>
          <p class="label">You</p>
          <p id="match-your-score" class="value">0</p>
        </div>
        <div>
          <p id="match-opponent-label" class="label">Opponent</p>
          <p id="match-opponent-score" class="value">0</p>
        </div>
      </div>
      <button class="restart-btn" onclick="restartQuiz()">Play Again</button>
    </div>

    <div id="score-screen" class="score-screen hidden">
      <h1>Quiz Complete</h1>
      <p class="score-message">Total score</p>
      <p id="score-value" class="score-value"></p>
      <p id="score-label" class="score-label"></p>
      <button class="restart-btn" onclick="restartQuiz()">Play Again</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const API_BASE = window.location.origin;
    const TIME_LIMIT_MS = 7000;
    const MAX_POINTS = 1000;
    const POINTS_PER_MS = MAX_POINTS / TIME_LIMIT_MS;
    const QUESTION_COUNT = 7;

    let socket = null;
    let gameMode = 'solo';
    let questions = [];
    let currentQuestion = null;
    let selectedTopicName = '';
    let selectedTopicId = '';
    let opponentNickname = '';
    let opponentScore = 0;
    let currentIndex = 0;
    let totalQuestions = QUESTION_COUNT;
    let answered = false;
    let correctCount = 0;
    let totalScore = 0;
    let questionStartedAt = 0;
    let rafId = null;
    let timeoutId = null;

    function getNickname() {
      const value = document.getElementById('nickname').value.trim();
      return value.slice(0, 20) || 'Player';
    }

    function ensureSocket() {
      if (!socket) {
        socket = io(API_BASE);

        socket.on('queue:waiting', ({ topicName }) => {
          document.getElementById('waiting-topic').textContent = `Topic: ${topicName}`;
          showScreen('waiting-screen');
        });

        socket.on('match:found', ({ opponentNickname: name, topicName }) => {
          gameMode = 'multiplayer';
          opponentNickname = name;
          selectedTopicName = topicName;
          totalScore = 0;
          correctCount = 0;
          opponentScore = 0;
          setMultiplayerUi(true);
          updateLiveScore(false);
          updateOpponentScore(false);
        });

        socket.on('round:start', (data) => {
          gameMode = 'multiplayer';
          currentIndex = data.questionIndex;
          totalQuestions = data.totalQuestions;
          selectedTopicName = data.topicName;
          currentQuestion = data.question;
          totalScore = data.scores.you;
          opponentScore = data.scores.opponent;
          answered = false;

          showScreen('quiz-screen');
          setMultiplayerUi(true);
          updateLiveScore(false);
          updateOpponentScore();
          loadQuestion(data.startedAt);
        });

        socket.on('opponent:answered', () => {
          if (gameMode !== 'multiplayer' || !answered) return;
          document.getElementById('feedback').textContent = 'Opponent answered — waiting for round...';
        });

        socket.on('round:end', (data) => {
          if (gameMode !== 'multiplayer') return;

          totalScore = data.yourScore;
          correctCount = data.yourCorrectCount;
          opponentScore = data.opponentScore;
          updateLiveScore(true);
          updateOpponentScore(true);
          revealAnswer(data.yourAnswer.selectedIndex, {
            isCorrect: data.yourAnswer.isCorrect,
            points: data.yourAnswer.points,
            correctIndex: data.correctIndex,
            timedOut: data.yourAnswer.selectedIndex === null
          });
        });

        socket.on('match:end', (data) => {
          clearTimer();
          showMatchScore(data);
        });

        socket.on('error', ({ message }) => {
          document.getElementById('topic-error').textContent = message;
          showScreen('topic-screen');
        });
      }

      return socket;
    }

    function setMultiplayerUi(enabled) {
      document.getElementById('match-meta').classList.toggle('hidden', !enabled);
      document.getElementById('opponent-sidebar').classList.toggle('hidden', !enabled);
      document.getElementById('next-btn').classList.toggle('hidden', enabled);

      document.getElementById('player-sidebar-title').textContent = enabled ? getNickname() : 'You';

      if (enabled) {
        document.getElementById('match-meta').textContent =
          `${selectedTopicName} · vs ${opponentNickname}`;
        document.getElementById('opponent-sidebar-title').textContent = opponentNickname;
      }
    }

    function updateOpponentScore(animateBump = false) {
      const maxPossible = getMaxPossibleScore() || QUESTION_COUNT * MAX_POINTS;
      const percent = Math.min(100, (opponentScore / maxPossible) * 100);
      const fill = document.getElementById('opponent-score-fill');

      fill.style.height = `${percent}%`;
      document.getElementById('opponent-live-score').textContent = opponentScore.toLocaleString();
      document.getElementById('opponent-max-score-hint').textContent = `/ ${maxPossible.toLocaleString()}`;

      if (animateBump) {
        fill.classList.add('bump');
        setTimeout(() => fill.classList.remove('bump'), 450);
      }
    }

    function getTimeLeftMs(elapsedMs) {
      return Math.max(0, TIME_LIMIT_MS - elapsedMs);
    }

    function calculatePoints(timeLeftMs) {
      return Math.round(timeLeftMs * POINTS_PER_MS);
    }

    function scoreAnswer(isCorrect, elapsedMs) {
      if (!isCorrect) return 0;
      return calculatePoints(getTimeLeftMs(elapsedMs));
    }

    function getPotentialPoints(timeLeftMs) {
      return calculatePoints(timeLeftMs);
    }

    function updateLiveScore(animateBump = false) {
      const maxPossible = getMaxPossibleScore() || QUESTION_COUNT * MAX_POINTS;
      const percent = Math.min(100, (totalScore / maxPossible) * 100);
      const fill = document.getElementById('score-fill');

      fill.style.height = `${percent}%`;
      document.getElementById('live-score').textContent = totalScore.toLocaleString();
      document.getElementById('max-score-hint').textContent = `/ ${maxPossible.toLocaleString()}`;

      if (animateBump) {
        fill.classList.add('bump');
        setTimeout(() => fill.classList.remove('bump'), 450);
      }
    }

    function getMaxPossibleScore() {
      const count = gameMode === 'multiplayer' ? totalQuestions : questions.length;
      return count * MAX_POINTS;
    }

    function formatTimeDisplay(timeLeftMs) {
      return `${(timeLeftMs / 1000).toFixed(1)}s`;
    }

    function updatePotentialPoints(timeLeftMs) {
      const potentialEl = document.getElementById('potential-points');
      const points = getPotentialPoints(timeLeftMs);
      potentialEl.textContent = `+${points} pts if correct now`;
      potentialEl.classList.toggle('urgent', timeLeftMs <= 3000);
    }

    function clearTimer() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      if (timeoutId) {
        clearTimeout(timeoutId);
        timeoutId = null;
      }
    }

    function freezeTimerBar() {
      const fill = document.getElementById('timer-fill');
      const elapsed = Date.now() - questionStartedAt;
      const percentLeft = Math.max(0, 100 * (1 - elapsed / TIME_LIMIT_MS));

      fill.classList.add('paused');
      fill.style.transition = 'none';
      fill.style.width = `${percentLeft}%`;
    }

    function updateTimerLabel(timeLeftMs) {
      const label = document.getElementById('timer-label');
      label.textContent = formatTimeDisplay(timeLeftMs);

      const isUrgent = timeLeftMs <= 3000;
      label.classList.toggle('urgent', isUrgent);
      document.getElementById('timer-fill').classList.toggle('urgent', isUrgent);
      updatePotentialPoints(timeLeftMs);
    }

    function tickTimer() {
      if (answered) return;

      const elapsed = Date.now() - questionStartedAt;
      const timeLeftMs = Math.max(0, TIME_LIMIT_MS - elapsed);
      updateTimerLabel(timeLeftMs);

      if (timeLeftMs > 0) {
        rafId = requestAnimationFrame(tickTimer);
      }
    }

    function startTimer(serverStartedAt) {
      clearTimer();
      questionStartedAt = serverStartedAt || Date.now();

      const fill = document.getElementById('timer-fill');
      fill.classList.remove('paused', 'urgent');
      fill.style.transition = 'none';

      const elapsed = Date.now() - questionStartedAt;
      const percentLeft = Math.max(0, 100 * (1 - elapsed / TIME_LIMIT_MS));
      fill.style.width = `${percentLeft}%`;
      fill.offsetHeight;

      const remainingMs = Math.max(0, TIME_LIMIT_MS - elapsed);
      fill.style.transition = `width ${remainingMs}ms linear`;
      fill.style.width = '0%';

      updateTimerLabel(remainingMs);

      if (gameMode === 'solo') {
        timeoutId = setTimeout(handleTimeout, remainingMs);
      }

      if (remainingMs > 0) {
        rafId = requestAnimationFrame(tickTimer);
      }
    }

    function showScreen(screenId) {
      ['topic-screen', 'waiting-screen', 'quiz-screen', 'score-screen', 'match-score-screen'].forEach((id) => {
        document.getElementById(id).classList.toggle('hidden', id !== screenId);
      });
      document.getElementById('card').classList.toggle('quiz-layout', screenId === 'quiz-screen');
    }

    async function loadTopics() {
      const topicList = document.getElementById('topic-list');
      const errorEl = document.getElementById('topic-error');
      topicList.innerHTML = '<button class="topic-btn" disabled>Loading topics...</button>';
      errorEl.textContent = '';

      try {
        const response = await fetch(`${API_BASE}/api/topics`);
        if (!response.ok) throw new Error('Could not load topics');

        const topics = await response.json();
        topicList.innerHTML = '';

        topics.forEach((topic) => {
          const row = document.createElement('div');
          row.className = 'topic-row';

          const name = document.createElement('p');
          name.className = 'topic-name';
          name.textContent = `${topic.name} (${topic._count.questions} questions)`;

          const actions = document.createElement('div');
          actions.className = 'topic-actions';

          const soloBtn = document.createElement('button');
          soloBtn.className = 'topic-btn';
          soloBtn.textContent = 'Solo Play';
          soloBtn.onclick = () => startQuiz(topic.id, topic.name);

          const battleBtn = document.createElement('button');
          battleBtn.className = 'topic-btn battle';
          battleBtn.textContent = 'Find Match';
          battleBtn.onclick = () => findMatch(topic.id, topic.name);

          actions.appendChild(soloBtn);
          actions.appendChild(battleBtn);
          row.appendChild(name);
          row.appendChild(actions);
          topicList.appendChild(row);
        });
      } catch (error) {
        topicList.innerHTML = '';
        errorEl.textContent =
          'Could not connect to server. Run "npm.cmd run dev" in the server folder, then refresh.';
      }
    }

    async function startQuiz(topicId, topicName) {
      const errorEl = document.getElementById('topic-error');
      errorEl.textContent = '';
      gameMode = 'solo';
      setMultiplayerUi(false);

      try {
        const response = await fetch(
          `${API_BASE}/api/topics/${topicId}/questions/random?count=${QUESTION_COUNT}`
        );
        if (!response.ok) throw new Error('Could not load questions');

        questions = await response.json();
        selectedTopicName = topicName;
        selectedTopicId = topicId;
        currentIndex = 0;
        totalQuestions = questions.length;
        correctCount = 0;
        totalScore = 0;
        answered = false;

        showScreen('quiz-screen');
        setMultiplayerUi(false);
        document.getElementById('player-sidebar-title').textContent = getNickname();
        updateLiveScore(false);
        loadQuestion();
      } catch (error) {
        errorEl.textContent = error.message;
      }
    }

    function findMatch(topicId, topicName) {
      const errorEl = document.getElementById('topic-error');
      errorEl.textContent = '';
      selectedTopicId = topicId;
      selectedTopicName = topicName;

      ensureSocket().emit('queue:join', {
        topicId,
        topicName,
        nickname: getNickname()
      });
    }

    function cancelMatchmaking() {
      if (socket) socket.emit('queue:leave');
      showScreen('topic-screen');
    }

    function revealAnswer(selectedIndex, serverResult) {
      const q = gameMode === 'multiplayer' ? currentQuestion : questions[currentIndex];
      const feedback = document.getElementById('feedback');
      const buttons = document.querySelectorAll('.options button');

      let isCorrect;
      let points;
      let correctIndex;
      let timedOut = selectedIndex === null;

      if (serverResult) {
        isCorrect = serverResult.isCorrect;
        points = serverResult.points;
        correctIndex = serverResult.correctIndex;
        timedOut = serverResult.timedOut;
      } else {
        const elapsedMs = Date.now() - questionStartedAt;
        isCorrect = selectedIndex === q.correctIndex;
        points = scoreAnswer(isCorrect, elapsedMs);
        correctIndex = q.correctIndex;
      }

      freezeTimerBar();
      clearTimer();
      document.getElementById('potential-points').textContent = isCorrect
        ? `+${points} pts earned`
        : '+0 pts this question';

      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === correctIndex) {
          btn.classList.add('selected-correct');
        } else if (selectedIndex !== null && index === selectedIndex) {
          btn.classList.add('selected-wrong');
        }
      });

      if (gameMode === 'solo') {
        if (isCorrect) {
          correctCount += 1;
          totalScore += points;
          updateLiveScore(true);
          feedback.textContent = `Correct! +${points} pts`;
          feedback.className = 'feedback correct';
        } else if (selectedIndex !== null) {
          feedback.textContent = 'Wrong! +0 pts';
          feedback.className = 'feedback wrong';
        } else {
          feedback.textContent = "Time's up! +0 pts";
          feedback.className = 'feedback wrong';
        }

        const nextBtn = document.getElementById('next-btn');
        nextBtn.textContent = currentIndex === questions.length - 1 ? 'See Results' : 'Next Question';
        nextBtn.classList.remove('hidden');
      } else if (isCorrect) {
        feedback.textContent = `Correct! +${points} pts`;
        feedback.className = 'feedback correct';
      } else if (timedOut) {
        feedback.textContent = "Time's up! +0 pts";
        feedback.className = 'feedback wrong';
      } else {
        feedback.textContent = 'Wrong! +0 pts';
        feedback.className = 'feedback wrong';
      }
    }

    function loadQuestion(serverStartedAt) {
      const q = gameMode === 'multiplayer' ? currentQuestion : questions[currentIndex];
      answered = false;

      document.getElementById('progress').textContent =
        `${selectedTopicName} · Q${currentIndex + 1}/${totalQuestions}`;
      document.getElementById('question').textContent = q.text;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';

      if (gameMode === 'solo') {
        document.getElementById('next-btn').classList.add('hidden');
      }

      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';

      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.textContent = option;
        btn.onclick = () => checkAnswer(index);
        optionsEl.appendChild(btn);
      });

      startTimer(serverStartedAt);
    }

    function checkAnswer(selectedIndex) {
      if (answered) return;
      answered = true;

      if (gameMode === 'multiplayer') {
        freezeTimerBar();
        clearTimer();
        document.querySelectorAll('.options button').forEach((btn) => {
          btn.disabled = true;
        });
        document.getElementById('feedback').textContent = 'Locked in! Waiting for round...';
        document.getElementById('feedback').className = 'feedback';
        ensureSocket().emit('answer:submit', { selectedIndex });
        return;
      }

      revealAnswer(selectedIndex);
    }

    function handleTimeout() {
      if (answered || gameMode !== 'solo') return;
      answered = true;
      revealAnswer(null);
    }

    function nextQuestion() {
      if (currentIndex >= questions.length - 1) {
        showScore();
        return;
      }

      currentIndex += 1;
      loadQuestion();
    }

    function showMatchScore(data) {
      opponentNickname = data.opponentNickname || opponentNickname;
      showScreen('match-score-screen');

      const resultEl = document.getElementById('match-result');
      if (data.forfeit) {
        resultEl.textContent = 'You win — opponent left';
        resultEl.className = 'match-result win';
      } else if (data.isDraw) {
        resultEl.textContent = "It's a draw!";
        resultEl.className = 'match-result draw';
      } else if (data.youWin) {
        resultEl.textContent = 'You win!';
        resultEl.className = 'match-result win';
      } else {
        resultEl.textContent = 'You lose';
        resultEl.className = 'match-result lose';
      }

      document.getElementById('match-your-score').textContent = data.yourScore.toLocaleString();
      document.getElementById('match-opponent-label').textContent = opponentNickname;
      document.getElementById('match-opponent-score').textContent = data.opponentScore.toLocaleString();
    }

    function showScore() {
      clearTimer();
      showScreen('score-screen');
      document.getElementById('score-value').textContent = totalScore.toLocaleString();
      document.getElementById('score-label').textContent =
        `${correctCount} / ${questions.length} correct in ${selectedTopicName}`;
    }

    function restartQuiz() {
      clearTimer();
      if (socket) socket.emit('queue:leave');

      gameMode = 'solo';
      currentIndex = 0;
      correctCount = 0;
      totalScore = 0;
      opponentScore = 0;
      answered = false;
      questions = [];
      currentQuestion = null;
      setMultiplayerUi(false);
      showScreen('topic-screen');
      loadTopics();
    }

    loadTopics();
  </script>
</body>
</html>
