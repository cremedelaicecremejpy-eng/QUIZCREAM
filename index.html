<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Question</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .card h1 {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #667eea;
      margin-bottom: 0.75rem;
    }

    .progress {
      font-size: 0.8125rem;
      color: #6b7280;
      margin-bottom: 0.5rem;
    }

    .timer {
      font-size: 1.125rem;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 1rem;
    }

    .timer.urgent {
      color: #dc2626;
    }

    .card .question {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.4;
      margin-bottom: 2rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .options button {
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      font-weight: 500;
      color: #1a1a2e;
      background: #f4f4f8;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .options button:hover:not(:disabled) {
      background: #ececf4;
      border-color: #667eea;
      transform: translateY(-1px);
    }

    .options button:active:not(:disabled) {
      transform: translateY(0);
    }

    .options button:disabled {
      cursor: default;
      opacity: 0.6;
      transform: none;
    }

    .options button.selected-correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #16a34a;
      opacity: 1;
    }

    .options button.selected-wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #dc2626;
      opacity: 1;
    }

    .feedback {
      margin-top: 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      min-height: 1.75rem;
    }

    .feedback.correct {
      color: #16a34a;
    }

    .feedback.wrong {
      color: #dc2626;
    }

    .next-btn {
      margin-top: 1.25rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #ffffff;
      background: #667eea;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .next-btn:hover {
      background: #5a6fd6;
      transform: translateY(-1px);
    }

    .next-btn:active {
      transform: translateY(0);
    }

    .next-btn.hidden {
      display: none;
    }

    .score-screen .score-value {
      font-size: 3rem;
      font-weight: 800;
      color: #667eea;
      margin: 1rem 0 0.5rem;
    }

    .score-screen .score-label {
      font-size: 1.125rem;
      color: #6b7280;
      margin-bottom: 2rem;
    }

    .score-screen .score-message {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 1.5rem;
    }

    .restart-btn {
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #ffffff;
      background: #667eea;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .restart-btn:hover {
      background: #5a6fd6;
      transform: translateY(-1px);
    }

    .topic-screen.hidden,
    .quiz-screen.hidden,
    .score-screen.hidden {
      display: none;
    }

    .topic-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .topic-btn {
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      color: #1a1a2e;
      background: #f4f4f8;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .topic-btn:hover:not(:disabled) {
      background: #ececf4;
      border-color: #667eea;
      transform: translateY(-1px);
    }

    .topic-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .error-msg {
      color: #dc2626;
      margin-top: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="topic-screen" class="topic-screen">
      <h1>Quiz Cream</h1>
      <p class="subtitle">Choose a topic. You'll get 7 random questions from the database.</p>
      <div id="topic-list" class="topic-list"></div>
      <p id="topic-error" class="error-msg"></p>
    </div>

    <div id="quiz-screen" class="quiz-screen hidden">
      <h1>Trivia</h1>
      <p id="progress" class="progress"></p>
      <p id="timer" class="timer">7s</p>
      <p id="question" class="question"></p>
      <div id="options" class="options"></div>
      <p id="feedback" class="feedback"></p>
      <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="score-screen" class="score-screen hidden">
      <h1>Quiz Complete</h1>
      <p class="score-message">Here's how you did:</p>
      <p id="score-value" class="score-value"></p>
      <p id="score-label" class="score-label"></p>
      <button class="restart-btn" onclick="restartQuiz()">Play Again</button>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001';
    const TIME_LIMIT = 7;
    const QUESTION_COUNT = 7;

    let questions = [];
    let selectedTopicName = '';
    let currentIndex = 0;
    let answered = false;
    let correctCount = 0;
    let timeLeft = TIME_LIMIT;
    let timerInterval = null;

    function clearTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function showScreen(screenId) {
      ['topic-screen', 'quiz-screen', 'score-screen'].forEach((id) => {
        document.getElementById(id).classList.toggle('hidden', id !== screenId);
      });
    }

    async function loadTopics() {
      const topicList = document.getElementById('topic-list');
      const errorEl = document.getElementById('topic-error');
      topicList.innerHTML = '<button class="topic-btn" disabled>Loading topics...</button>';
      errorEl.textContent = '';

      try {
        const response = await fetch(`${API_BASE}/api/topics`);
        if (!response.ok) throw new Error('Could not load topics');

        const topics = await response.json();
        topicList.innerHTML = '';

        topics.forEach((topic) => {
          const btn = document.createElement('button');
          btn.className = 'topic-btn';
          btn.textContent = `${topic.name} (${topic._count.questions} questions)`;
          btn.onclick = () => startQuiz(topic.id, topic.name);
          topicList.appendChild(btn);
        });
      } catch (error) {
        topicList.innerHTML = '';
        errorEl.textContent =
          'Could not connect to server. Run "npm.cmd run dev" in the server folder, then refresh.';
      }
    }

    async function startQuiz(topicId, topicName) {
      const errorEl = document.getElementById('topic-error');
      errorEl.textContent = '';

      try {
        const response = await fetch(
          `${API_BASE}/api/topics/${topicId}/questions/random?count=${QUESTION_COUNT}`
        );
        if (!response.ok) throw new Error('Could not load questions');

        questions = await response.json();
        selectedTopicName = topicName;
        currentIndex = 0;
        correctCount = 0;
        answered = false;

        showScreen('quiz-screen');
        loadQuestion();
      } catch (error) {
        errorEl.textContent = error.message;
      }
    }

    function updateTimerDisplay() {
      const timerEl = document.getElementById('timer');
      timerEl.textContent = `${timeLeft}s`;
      timerEl.classList.toggle('urgent', timeLeft <= 3);
    }

    function startTimer() {
      clearTimer();
      timeLeft = TIME_LIMIT;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timeLeft -= 1;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearTimer();
          handleTimeout();
        }
      }, 1000);
    }

    function revealAnswer(selectedIndex) {
      const q = questions[currentIndex];
      const feedback = document.getElementById('feedback');
      const buttons = document.querySelectorAll('.options button');
      const isCorrect = selectedIndex === q.correctIndex;

      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === q.correctIndex) {
          btn.classList.add('selected-correct');
        } else if (selectedIndex !== null && index === selectedIndex) {
          btn.classList.add('selected-wrong');
        }
      });

      if (isCorrect) {
        correctCount += 1;
        feedback.textContent = 'Correct!';
        feedback.className = 'feedback correct';
      } else if (selectedIndex !== null) {
        feedback.textContent = 'Wrong!';
        feedback.className = 'feedback wrong';
      } else {
        feedback.textContent = "Time's up!";
        feedback.className = 'feedback wrong';
      }

      const nextBtn = document.getElementById('next-btn');
      nextBtn.textContent = currentIndex === questions.length - 1 ? 'See Results' : 'Next Question';
      nextBtn.classList.remove('hidden');
    }

    function loadQuestion() {
      const q = questions[currentIndex];
      answered = false;

      document.getElementById('progress').textContent =
        `${selectedTopicName} — Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById('question').textContent = q.text;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('next-btn').classList.add('hidden');

      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';

      q.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.textContent = option;
        btn.onclick = () => checkAnswer(index);
        optionsEl.appendChild(btn);
      });

      startTimer();
    }

    function checkAnswer(selectedIndex) {
      if (answered) return;
      answered = true;
      clearTimer();
      revealAnswer(selectedIndex);
    }

    function handleTimeout() {
      if (answered) return;
      answered = true;
      revealAnswer(null);
    }

    function nextQuestion() {
      if (currentIndex >= questions.length - 1) {
        showScore();
        return;
      }

      currentIndex += 1;
      loadQuestion();
    }

    function showScore() {
      clearTimer();
      showScreen('score-screen');
      document.getElementById('score-value').textContent =
        `${correctCount} / ${questions.length}`;
      document.getElementById('score-label').textContent =
        `${correctCount} correct out of ${questions.length} questions in ${selectedTopicName}`;
    }

    function restartQuiz() {
      clearTimer();
      currentIndex = 0;
      correctCount = 0;
      answered = false;
      questions = [];
      showScreen('topic-screen');
      loadTopics();
    }

    loadTopics();
  </script>
</body>
</html>
