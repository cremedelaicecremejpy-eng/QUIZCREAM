<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Question</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1.5rem;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .card h1 {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #667eea;
      margin-bottom: 0.75rem;
    }

    .progress {
      font-size: 0.8125rem;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }

    .timer {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .timer-bar {
      flex: 1;
      height: 8px;
      background: #ececf4;
      border-radius: 999px;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: #667eea;
      border-radius: 999px;
      transform-origin: left center;
      transition: transform 1s linear, background 0.2s;
    }

    .timer-fill.no-transition {
      transition: none;
    }

    .timer-fill.warning {
      background: #f59e0b;
    }

    .timer-fill.danger {
      background: #dc2626;
    }

    .timer-count {
      font-size: 0.875rem;
      font-weight: 700;
      color: #1a1a2e;
      min-width: 1.5rem;
      text-align: right;
    }

    .card .question {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.4;
      margin-bottom: 2rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .options button {
      padding: 0.875rem 1.25rem;
      font-size: 1rem;
      font-weight: 500;
      color: #1a1a2e;
      background: #f4f4f8;
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .options button:hover:not(:disabled) {
      background: #ececf4;
      border-color: #667eea;
      transform: translateY(-1px);
    }

    .options button:active:not(:disabled) {
      transform: translateY(0);
    }

    .options button:disabled {
      cursor: default;
      opacity: 0.6;
      transform: none;
    }

    .options button.selected-correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #16a34a;
      opacity: 1;
    }

    .options button.selected-wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #dc2626;
      opacity: 1;
    }

    .feedback {
      margin-top: 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      min-height: 1.75rem;
    }

    .feedback.correct {
      color: #16a34a;
    }

    .feedback.wrong {
      color: #dc2626;
    }

    .next-btn,
    .play-again-btn {
      margin-top: 1.25rem;
      padding: 0.75rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #ffffff;
      background: #667eea;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .next-btn:hover,
    .play-again-btn:hover {
      background: #5a6fd6;
      transform: translateY(-1px);
    }

    .next-btn:active,
    .play-again-btn:active {
      transform: translateY(0);
    }

    .next-btn.hidden,
    .hidden {
      display: none;
    }

    .score-page .score-value {
      font-size: 3.5rem;
      font-weight: 800;
      color: #1a1a2e;
      line-height: 1;
      margin: 0.5rem 0 0.75rem;
    }

    .score-page .score-label {
      font-size: 1.125rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 0.5rem;
    }

    .score-page .score-message {
      font-size: 1rem;
      color: #6b7280;
      margin-bottom: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="quiz-view">
      <h1>Trivia</h1>
      <p id="progress" class="progress"></p>
      <div class="timer" aria-live="polite">
        <div class="timer-bar">
          <div id="timer-fill" class="timer-fill"></div>
        </div>
        <span id="timer-count" class="timer-count">7</span>
      </div>
      <p id="question" class="question"></p>
      <div id="options" class="options"></div>
      <p id="feedback" class="feedback"></p>
      <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="score-view" class="score-page hidden">
      <h1>Quiz Complete</h1>
      <p class="score-label">Your score</p>
      <p id="score-value" class="score-value"></p>
      <p id="score-detail" class="score-message"></p>
      <p id="score-message" class="score-message"></p>
      <button class="play-again-btn" onclick="restartQuiz()">Play Again</button>
    </div>
  </div>

  <script>
    const QUESTION_TIME_SECONDS = 7;

    const questions = [
      {
        text: 'What is the capital of France?',
        options: ['Paris', 'London', 'Berlin', 'Madrid'],
        answer: 'Paris'
      },
      {
        text: 'What is the capital of Japan?',
        options: ['Seoul', 'Tokyo', 'Beijing', 'Bangkok'],
        answer: 'Tokyo'
      },
      {
        text: 'What is the capital of Australia?',
        options: ['Sydney', 'Melbourne', 'Canberra', 'Perth'],
        answer: 'Canberra'
      },
      {
        text: 'What is the capital of Brazil?',
        options: ['Rio de Janeiro', 'São Paulo', 'Brasília', 'Salvador'],
        answer: 'Brasília'
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let remainingSeconds = QUESTION_TIME_SECONDS;
    let timerId = null;

    function clearTimer() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function updateTimerDisplay() {
      const fill = document.getElementById('timer-fill');
      const count = document.getElementById('timer-count');
      const ratio = remainingSeconds / QUESTION_TIME_SECONDS;

      count.textContent = remainingSeconds;
      fill.style.transform = `scaleX(${ratio})`;
      fill.classList.remove('warning', 'danger');

      if (remainingSeconds <= 2) {
        fill.classList.add('danger');
      } else if (remainingSeconds <= 4) {
        fill.classList.add('warning');
      }
    }

    function startTimer() {
      clearTimer();
      remainingSeconds = QUESTION_TIME_SECONDS;

      const fill = document.getElementById('timer-fill');
      fill.classList.add('no-transition');
      updateTimerDisplay();
      void fill.offsetWidth;
      fill.classList.remove('no-transition');

      timerId = setInterval(() => {
        remainingSeconds -= 1;
        updateTimerDisplay();

        if (remainingSeconds <= 0) {
          handleTimeout();
        }
      }, 1000);
    }

    function loadQuestion() {
      const q = questions[currentIndex];
      answered = false;

      document.getElementById('progress').textContent =
        `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById('question').textContent = q.text;
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').className = 'feedback';

      const nextBtn = document.getElementById('next-btn');
      nextBtn.classList.add('hidden');
      nextBtn.textContent = currentIndex === questions.length - 1
        ? 'See Results'
        : 'Next Question';

      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';

      q.options.forEach(option => {
        const btn = document.createElement('button');
        btn.textContent = option;
        btn.onclick = () => checkAnswer(option, btn);
        optionsEl.appendChild(btn);
      });

      startTimer();
    }

    function lockOptions(selectedBtn) {
      const q = questions[currentIndex];
      const buttons = document.querySelectorAll('.options button');

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.answer) {
          btn.classList.add('selected-correct');
        } else if (selectedBtn && btn === selectedBtn) {
          btn.classList.add('selected-wrong');
        }
      });
    }

    function finishQuestion() {
      document.getElementById('next-btn').classList.remove('hidden');
    }

    function checkAnswer(selected, clickedBtn) {
      if (answered) return;
      answered = true;
      clearTimer();

      const q = questions[currentIndex];
      const feedback = document.getElementById('feedback');
      const isCorrect = selected === q.answer;

      lockOptions(clickedBtn);

      if (isCorrect) {
        score += 1;
        feedback.textContent = 'Correct!';
        feedback.className = 'feedback correct';
      } else {
        feedback.textContent = 'Wrong!';
        feedback.className = 'feedback wrong';
      }

      finishQuestion();
    }

    function handleTimeout() {
      if (answered) return;
      answered = true;
      clearTimer();
      remainingSeconds = 0;
      updateTimerDisplay();

      lockOptions(null);

      const feedback = document.getElementById('feedback');
      feedback.textContent = "Time's up!";
      feedback.className = 'feedback wrong';

      finishQuestion();
    }

    function showScorePage() {
      clearTimer();
      document.getElementById('quiz-view').classList.add('hidden');
      document.getElementById('score-view').classList.remove('hidden');

      const total = questions.length;
      const percent = Math.round((score / total) * 100);

      document.getElementById('score-value').textContent = `${score}/${total}`;
      document.getElementById('score-detail').textContent =
        `${percent}% correct`;

      let message = 'Keep practicing!';
      if (score === total) {
        message = 'Perfect score!';
      } else if (score >= Math.ceil(total * 0.75)) {
        message = 'Great job!';
      } else if (score >= Math.ceil(total * 0.5)) {
        message = 'Nice try!';
      }

      document.getElementById('score-message').textContent = message;
    }

    function nextQuestion() {
      if (currentIndex >= questions.length - 1) {
        showScorePage();
        return;
      }

      currentIndex += 1;
      loadQuestion();
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      document.getElementById('score-view').classList.add('hidden');
      document.getElementById('quiz-view').classList.remove('hidden');
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
